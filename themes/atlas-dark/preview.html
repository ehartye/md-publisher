<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>ATLAS preview</title>
<style>
/* ============================================================================
 * atlas-dark.css — ATLAS theme, dark variant.
 *
 * Same editorial-trust skeleton as atlas-light, palette inverted to a deep
 * navy paper with bone ink. Red shifts to a slightly warmer #E84855 for
 * contrast against the darker surface.
 *
 * Tokens lifted from themes/theme-spec.json -> themes.atlas.modes.dark.
 * ============================================================================ */

@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,800;1,6..72,400;1,6..72,800&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@300;500&display=swap');

:root {
    --bg:           #0F1620;
    --paper:        #1A2330;
    --ink:          #F8F1E7;
    --ink-soft:     #B0BAC9;
    --accent:       #E84855;
    --accent-soft:  #2E3947;
    --rule:         #2E3947;
    --code-bg:      #1F2832;
    --code-text:    #F8F1E7;
    --table-stripe: #14202B;

    --font-display: "Newsreader", Georgia, "Times New Roman", serif;
    --font-body:    "Newsreader", Georgia, "Times New Roman", serif;
    --font-sans:    "Sora", "Helvetica Neue", Arial, sans-serif;
    --font-mono:    "JetBrains Mono", "SF Mono", Consolas, monospace;

    --size-body: 11pt;
    --leading-body: 1.5;
    --page-margin: 1in;
}

@page {
    size: letter;
    margin: var(--page-margin);
    background: var(--bg);

    @bottom-center {
        content: counter(page);
        font-family: var(--font-sans);
        font-size: 9pt;
        color: var(--ink-soft);
    }
    @top-right {
        content: string(doc-title);
        font-family: var(--font-sans);
        font-size: 9pt;
        color: var(--ink-soft);
        letter-spacing: 0.04em;
    }
}
@page :first {
    @top-right { content: ""; }
    @bottom-center { content: ""; }
}

html {
    font-family: var(--font-body);
    font-size: var(--size-body);
    line-height: var(--leading-body);
    color: var(--ink);
    background: var(--bg);
    widows: 3;
    orphans: 3;
}
body { margin: 0; padding: 0; }
h1.doc-title { string-set: doc-title content(); }

h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-display);
    color: var(--ink);
    line-height: 1.15;
    break-after: avoid-page;
    page-break-after: avoid;
}

h1 {
    font-size: 28pt;
    font-weight: 800;
    font-style: italic;
    letter-spacing: -0.02em;
    margin: 0 0 0.6em 0;
    padding-bottom: 0.4em;
    bookmark-level: 1;
    break-before: page;
    page-break-before: always;
    position: relative;
}
h1::after {
    content: "";
    display: block;
    width: 96px;
    height: 1px;
    background: var(--accent);
    margin-top: 0.4em;
}
h1.doc-title {
    break-before: auto;
    page-break-before: auto;
    margin-top: 0;
}

h2 {
    font-style: normal;
    font-size: 18pt;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 1.4em 0 0.5em 0;
    bookmark-level: 2;
}
h3 { font-size: 13pt; font-weight: 600; margin: 1.1em 0 0.4em 0; bookmark-level: 3; }
h4, h5, h6 { font-size: 11.5pt; font-weight: 600; margin: 1em 0 0.3em 0; bookmark-level: 4; }

p { margin: 0 0 0.6em 0; text-align: justify; hyphens: auto; }
a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
strong { font-weight: 600; }
em { font-style: italic; }

code {
    font-family: var(--font-mono);
    font-size: 0.9em;
    background: var(--code-bg);
    border: 1px solid var(--accent-soft);
    border-radius: 3px;
    padding: 0.05em 0.3em;
    line-height: 1;
    color: var(--code-text);
}
pre code { background: transparent; border: none; padding: 0; font-size: inherit; line-height: inherit; border-radius: 0; }

pre {
    font-family: var(--font-mono);
    font-weight: 300;
    font-size: 9pt;
    line-height: 1.5;
    background: var(--code-bg);
    color: var(--code-text);
    border-left: 2px solid var(--accent);
    border-radius: 0;
    padding: 0.7em 0.9em;
    margin: 0.8em 0;
    overflow: hidden;
    white-space: pre-wrap;
    word-wrap: break-word;
    break-inside: avoid;
    page-break-inside: avoid;
}
.codehilite { margin: 0.8em 0; break-inside: avoid; page-break-inside: avoid; }
.codehilite pre { margin: 0; }

table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.9em 0;
    font-family: var(--font-sans);
    font-size: 10pt;
    break-inside: avoid;
    page-break-inside: avoid;
    color: var(--ink);
}
thead { display: table-header-group; }
th, td { padding: 0.45em 0.7em; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
th {
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 9pt;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--accent);
    background: transparent;
}
tbody tr:nth-child(even) td { background: var(--table-stripe); }
th[style*="right"], td[style*="right"] { text-align: right; }
th[style*="center"], td[style*="center"] { text-align: center; }

figure.mermaid {
    margin: 1em auto;
    text-align: center;
    background: var(--paper);
    padding: 0.5em;
    break-inside: avoid;
    page-break-inside: avoid;
    break-before: avoid;
    page-break-before: avoid;
}
figure.mermaid svg { display: block; margin: 0 auto; max-width: 100%; max-height: 6in; width: auto; height: auto; }
figure.mermaid figcaption { font-family: var(--font-sans); font-size: 9pt; color: var(--ink-soft); margin-top: 0.4em; }
figure.mermaid.oversized {
    break-before: page;
    break-after: page;
    page-break-before: always;
    page-break-after: always;
    break-inside: avoid;
    page-break-inside: avoid;
    margin: 0;
}
figure.mermaid.oversized svg { max-width: 6.5in; max-height: 9in; width: auto; height: auto; }

ul, ol { margin: 0.4em 0 0.8em 1.4em; padding: 0; }
li { margin: 0.2em 0; }

blockquote {
    margin: 0.8em 0;
    padding: 0.4em 1em;
    border-left: 3px solid var(--accent);
    background: var(--paper);
    color: var(--ink-soft);
    font-family: var(--font-sans);
    break-inside: avoid;
    page-break-inside: avoid;
}

hr { border: none; border-top: 1px solid var(--rule); margin: 1.2em 0; }

nav#toc { break-after: page; page-break-after: always; }
nav#toc h2.toc-title {
    font-family: var(--font-display);
    font-size: 22pt;
    font-weight: 800;
    font-style: italic;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0 0 1em 0;
    padding-bottom: 0.3em;
    border-bottom: 1px solid var(--accent);
    break-before: auto;
    page-break-before: auto;
    bookmark-level: none;
}
nav#toc ol { list-style: none; margin: 0; padding: 0; counter-reset: toc-counter; }
nav#toc ol ol { margin-left: 1.2em; }
nav#toc li { margin: 0.35em 0; }
nav#toc a { display: block; color: var(--ink); border-bottom: none; font-family: var(--font-sans); text-decoration: none; }
nav#toc li.toc-h1 > a { font-size: 12pt; font-weight: 600; margin-top: 0.6em; }
nav#toc li.toc-h2 > a { font-size: 10.5pt; font-weight: 400; color: var(--ink-soft); padding-left: 0.6em; }
nav#toc a::after {
    content: leader('. ') target-counter(attr(href), page);
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    font-weight: 500;
}

.preview-page { width: 7in; margin: 1in auto; background: var(--bg); padding: 1in; }
.mermaid-fig { margin: 1.5em 0; padding: 0.5em; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; }
.mermaid-fig figcaption { font-family: var(--font-sans); font-size: 9pt; color: var(--ink-soft); margin-top: 0.4em; text-align: center; }
.mermaid-fig svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.mermaid-source { font-family: var(--font-mono); font-size: 0.8em; background: var(--code-bg); padding: 0.5em; overflow-x: auto; }
.mermaid-fallback-note { font-family: var(--font-sans); font-size: 8pt; color: var(--ink-soft); font-style: italic; }
</style></head>
<body><div class="preview-page">
<h1>ATLAS</h1>
<p style="color: var(--ink-soft); font-style: italic;">Editorial-trust serif on warm bone, red as punctuation only.</p>
<h2>Section heading</h2>
<p>The quick brown fox jumps over the lazy dog. Body text in <em>Newsreader</em>; an <a href="#">accent link</a> like this.</p>
<pre><code>def example():
    return "code block"</code></pre>
<table><thead><tr><th>Column</th><th>Column</th></tr></thead>
<tbody><tr><td>Row data</td><td>More data</td></tr></tbody></table>

<h2>Diagram preview</h2>
<figure class="mermaid-fig">
<pre class="mermaid-source">flowchart LR
    classDef ingress   fill:#1A2330,stroke:#E84855,color:#F8F1E7,stroke-width:2
    classDef core      fill:#1A2330,stroke:#B0BAC9,color:#F8F1E7,stroke-width:1
    classDef transform fill:#1F2832,stroke:#B0BAC9,color:#F8F1E7,stroke-width:1
    classDef bridge    fill:transparent,stroke:#B0BAC9,color:#B0BAC9,stroke-width:1,stroke-dasharray:4 3
    A[Input]:::ingress --> B[Validate]:::transform
    B --> C[Process]:::core
    C --> D{Decision}:::bridge
    D --> E[Output]:::ingress
</pre><p class="mermaid-fallback-note">(install runtime then re-scaffold to see live diagrams)</p>
<figcaption>Flowchart with classDef tags</figcaption>
</figure>
<figure class="mermaid-fig">
<pre class="mermaid-source">erDiagram
    CUSTOMER {
        string id PK
        string name
        string email
    }
    ORDER {
        string id PK
        string customer_id FK
        decimal total
        date placed_at
    }
    CUSTOMER ||--o{ ORDER : places
</pre><p class="mermaid-fallback-note">(install runtime then re-scaffold to see live diagrams)</p>
<figcaption>ER diagram (themed via mermaid-config)</figcaption>
</figure>
<figure class="mermaid-fig">
<pre class="mermaid-source">classDiagram
    class Engine:::ingress {
        +run()
        +stop()
    }
    class Worker {
        +process(task)
    }
    class Queue {
        +enqueue(item)
        +dequeue() item
    }
    Engine --> Queue
    Engine --> Worker
    Worker --> Queue
</pre><p class="mermaid-fallback-note">(install runtime then re-scaffold to see live diagrams)</p>
<figcaption>Class diagram with <code>:::ingress</code> header tag</figcaption>
</figure>

<p style="margin-top: 1em; font-family: var(--font-sans); font-size: 9pt; color: var(--ink-soft);">
&mdash; ATLAS &middot; theme preview</p>
</div></body></html>
